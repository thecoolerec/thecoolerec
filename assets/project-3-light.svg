 <text x="78" y="35" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="25" font-weight="bold" fill="var(--paper)">luxury-model-cleaning-skill</text>
 <text x="80" y="60" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" fill="var(--mute)">Deterministic identities for messy watch reference data.</text>
 <text x="924" y="15" class="mono" font-size="10" fill="var(--quiet)">DATA / IDENTITY</text>

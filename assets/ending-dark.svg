<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="72 magnetic cores encode an easter egg."><title>72 magnetic cores encode an easter egg.</title><style><![CDATA[
 :root{--bg:#12161D;--paper:#EDF1F5;--acid:#9BBBD9;--rust:#C9A17A;--mute:#9AA8B8;--rule:#35414D;--core:#51606F;--quiet:#748292;--panel:#19212B}

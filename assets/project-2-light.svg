<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-label="api-contract-sync — Keep YApi in sync with the endpoints that changed."><title>api-contract-sync — Keep YApi in sync with the endpoints that changed.</title><style><![CDATA[
 :root{--bg:#F3F6F9;--paper:#253040;--acid:#3D6488;--rust:#9B7656;--mute:#667686;--rule:#C7D0D9;--core:#9BA9B7;--quiet:#778698;--panel:#E9EEF3}
 .mono{font-family:'DejaVu Sans Mono',Consolas,'Liberation Mono',monospace;letter-spacing:1px}
 .name{font-family:'DejaVu Sans Mono',Consolas,'Liberation Mono',monospace;font-weight:750;letter-spacing:-5px}
 .r{stroke:var(--rule);stroke-width:1;fill:none}
 .base{fill:none;stroke:var(--core);stroke-width:1.2;opacity:.50}
 .active{fill:none;stroke:var(--acid);stroke-width:2;opacity:.87;animation:glow 5s ease-in-out var(--delay) infinite}
 .hot{fill:none;stroke:var(--rust);stroke-width:2;opacity:.80;animation:glow 4s ease-in-out var(--delay) infinite}
 .spin{fill:none;stroke:var(--acid);stroke-width:1.35;stroke-dasharray:4 11;animation:rot 24s linear infinite}
 @keyframes glow{0%,100%{opacity:.48}50%{opacity:1}}@keyframes rot{to{stroke-dashoffset:-640}}
 @media(prefers-reduced-motion:reduce){.active,.hot,.spin{animation:none}}
 ]]></style><path class="r" d="M0 .6H1200M0 85.5H1200"/>
